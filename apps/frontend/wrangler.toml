name = "kei-portfolio-frontend"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Domain utama. workers.dev tetap hidup hanya untuk redirect 301 ke domain ini (worker/index.ts).
workers_dev = true
routes = [{ pattern = "kei-portfolio.eiklab.com", custom_domain = true }]

# SPA statis (PRD §5.2: Workers static assets, bukan Pages).
# Route yang tidak cocok dengan file dilayani index.html, routing di React Router.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Semua request lewat Worker dulu supaya redirect workers.dev juga berlaku untuk aset.
run_worker_first = true

[[services]]
binding = "BACKEND"
service = "kei-portfolio-backend"
