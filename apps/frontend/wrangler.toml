name = "kei-portfolio-frontend"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# SPA statis (PRD §5.2: Workers static assets, bukan Pages).
# Route yang tidak cocok dengan file dilayani index.html, routing di React Router.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[services]]
binding = "BACKEND"
service = "kei-portfolio-backend"
