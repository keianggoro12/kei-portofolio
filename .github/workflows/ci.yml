name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      automation: ${{ steps.filter.outputs.automation }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - '.github/**'
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - '.github/**'
            automation:
              - 'automation/helpmycv/**'
              - 'packages/shared/src/runner.ts'
              - '.github/**'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck and build frontend
        run: npm run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck backend
        run: npm run typecheck
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist

  automation:
    name: Automation
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/helpmycv
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          working-directory: automation/helpmycv
      - name: Typecheck tests
        run: npm run typecheck
      # Memastikan semua spec bisa dimuat tanpa menjalankan browser.
      - name: List tests
        run: npx playwright test --list
