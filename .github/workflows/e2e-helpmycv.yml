name: E2E HelpMyCV

# Tidak pernah dipicu pull_request, supaya secret tidak terbuka untuk kode dari PR (PRD GHA-07).
on:
  workflow_dispatch:
  schedule:
    # Tiap hari 08:00 WIB
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-helpmycv
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automation/helpmycv
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          working-directory: automation/helpmycv

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          # Tanpa key, isi CV memakai data dummy faker; test tetap jalan.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/helpmycv/playwright-report/
          retention-days: 14

      - name: Upload screenshots, videos and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: automation/helpmycv/test-results/
          retention-days: 14
